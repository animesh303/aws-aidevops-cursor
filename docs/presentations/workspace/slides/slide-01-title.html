<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #232F3E; color: #FFFFFF;
  padding: 20pt 40pt; margin: 0;
}
.header h1 {
  margin: 0; font-size: 36pt; font-weight: bold;
  color: #FFFFFF;
}
.header .subtitle {
  margin: 8pt 0 0 0; font-size: 18pt; color: #FFFFFF;
  opacity: 0.9;
}
.content {
  flex: 1; padding: 40pt; overflow: hidden;
}
.content h2 {
  color: #232F3E; font-size: 28pt; margin: 0 0 20pt 0;
  font-weight: bold;
}
.content p {
  color: #232F3E; font-size: 16pt; line-height: 1.6;
  margin: 12pt 0;
}
.content ul {
  color: #232F3E; font-size: 16pt; line-height: 1.8;
  margin: 12pt 0; padding-left: 30pt;
}
.content li {
  margin: 8pt 0;
}
.highlight {
  color: #FF9900; font-weight: bold;
}
</style>
</head>
<body>
<div class="header"><h1>AWS Bedrock Training</h1><p class="subtitle">Building Generative AI Applications with Amazon Bedrock</p></div>
<div class="content"><h2>Building Generative AI Applications</h2><p style="font-size: 20pt; margin-top: 30pt;">Training Session Overview</p></div>
</body>
</html>
