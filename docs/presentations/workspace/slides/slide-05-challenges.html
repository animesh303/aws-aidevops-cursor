<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.content {
  flex: 1; padding: 40pt 50pt 100pt 50pt; overflow: hidden;
}
.title-wrapper {
  margin-bottom: 20pt;
}
.title-wrapper h1 {
  color: #232F3E; font-size: 42pt; margin: 0 0 15pt 0;
  font-weight: bold;
}
.title-border {
  width: 100pt; height: 4pt; background: #FF9900;
  margin: 0;
}
.content p {
  color: #232F3E; font-size: 18pt; line-height: 1.7;
  margin: 15pt 0 12pt 0;
}
.challenges-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20pt;
  margin-top: 10pt;
}
.challenges-grid ul {
  color: #232F3E; font-size: 16pt; line-height: 1.3;
  margin: 0; padding-left: 30pt;
}
.challenges-grid li {
  margin: 4pt 0;
}
</style>
</head>
<body>
<div class="content">
<div class="title-wrapper">
<h1>Challenges with Foundation Models</h1>
<div class="title-border"></div>
</div>
<p><strong>Before AWS Bedrock:</strong></p>
<div class="challenges-grid">
<ul>
<li>❌ Complex model selection</li>
<li>❌ Infrastructure management</li>
<li>❌ Security & compliance concerns</li>
</ul>
<ul>
<li>❌ High costs for experimentation</li>
<li>❌ Vendor lock-in</li>
<li>❌ Integration complexity</li>
</ul>
</div>
</div>
</body>
</html>
