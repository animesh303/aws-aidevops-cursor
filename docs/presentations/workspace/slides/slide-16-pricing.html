<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.content {
  flex: 1; padding: 40pt 60pt 110pt 60pt; overflow: hidden;
}
.title-wrapper {
  margin-bottom: 18pt;
}
.title-wrapper h1 {
  color: #232F3E; font-size: 42pt; margin: 0 0 12pt 0;
  font-weight: bold;
}
.title-border {
  width: 100pt; height: 4pt; background: #FF9900;
  margin: 0;
}
.highlight-box {
  background: #F5F5F5; border-left: 6pt solid #FF9900;
  padding: 15pt; margin: 10pt 0 8pt 0;
}
.highlight-box h2 {
  color: #232F3E; font-size: 22pt; margin: 0 0 8pt 0;
  font-weight: bold;
}
.highlight-box ul {
  color: #232F3E; font-size: 15pt; line-height: 1.4;
  margin: 0; padding-left: 30pt;
}
.highlight-box li {
  margin: 3pt 0;
}
.content h2 {
  color: #232F3E; font-size: 22pt; margin: 12pt 0 6pt 0;
  font-weight: bold;
}
.content ul {
  color: #232F3E; font-size: 14pt; line-height: 1.3;
  margin: 0; padding-left: 30pt;
}
.content li {
  margin: 2pt 0;
}
</style>
</head>
<body>
<div class="content">
<div class="title-wrapper">
<h1>Pricing Model</h1>
<div class="title-border"></div>
</div>
<div class="highlight-box">
<h2>Pay-as-You-Go</h2>
<ul>
<li><strong>No upfront costs</strong></li>
<li><strong>No minimum commitments</strong></li>
<li><strong>Pay only for what you use</strong></li>
</ul>
</div>
<h2>Pricing Factors:</h2>
<ul>
<li><strong>Model type</strong> (text, image, embedding)</li>
<li><strong>Input/Output tokens</strong> (prompt & response length)</li>
<li><strong>Model provider</strong> (varies by provider)</li>
</ul>
</div>
</body>
</html>
