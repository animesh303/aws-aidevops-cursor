<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.content {
  flex: 1; padding: 40pt 60pt 110pt 60pt; overflow: hidden;
}
.title-wrapper {
  margin-bottom: 18pt;
}
.title-wrapper h1 {
  color: #232F3E; font-size: 42pt; margin: 0 0 12pt 0;
  font-weight: bold;
}
.title-border {
  width: 100pt; height: 4pt; background: #FF9900;
  margin: 0;
}
.resources-container {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20pt;
  margin-top: 10pt;
}
.resource-section h2 {
  color: #232F3E; font-size: 20pt; margin: 0 0 8pt 0;
  font-weight: bold;
}
.resource-section ul {
  color: #232F3E; font-size: 15pt; line-height: 1.5;
  margin: 0; padding-left: 30pt;
}
.resource-section li {
  margin: 4pt 0;
}
.resource-section-full {
  grid-column: 1 / -1;
}
</style>
</head>
<body>
<div class="content">
<div class="title-wrapper">
<h1>Resources</h1>
<div class="title-border"></div>
</div>
<div class="resources-container">
<div class="resource-section">
<h2>Documentation:</h2>
<ul>
<li>📚 AWS Bedrock Documentation</li>
<li>📖 AWS Bedrock User Guide</li>
<li>🔧 AWS Bedrock API Reference</li>
</ul>
</div>
<div class="resource-section">
<h2>Learning:</h2>
<ul>
<li>🎓 AWS Bedrock Training</li>
<li>📹 AWS Bedrock Videos</li>
<li>💻 AWS Bedrock Samples</li>
</ul>
</div>
<div class="resource-section-full">
<h2>Support:</h2>
<ul>
<li>💬 AWS Bedrock Forum</li>
<li>🐛 AWS Support</li>
</ul>
</div>
</div>
</div>
</body>
</html>
